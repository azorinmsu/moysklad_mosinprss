openapi: 3.1.0
info:
  title: MoySklad Remap stub control API
  version: 0.0.0-draft
  summary: Управляющий API заглушки. Имитацию Remap API сюда не копировать.
  description: |
    Каркас заполняет студент.

    Этот документ описывает только операции управления сценарием. Они лежат вне
    префикса `/api/remap/1.2`. Имитируемые пути Remap перечисляются в
    `docs/integration/api-compatibility-matrix.md` и ведут себя по официальной
    документации.

    В управляющем API должны найтись возможности: сброс состояния, загрузка
    тестовых данных, искусственная задержка, ответы 429, 500 и 503, обрыв
    соединения, таймаут, повторная доставка вебхука с тем же requestId,
    доставка событий не по порядку, окно недоступности, успешное сохранение
    документа без возврата HTTP-ответа клиенту интеграции.

    Секреты и адреса боевого аккаунта в примеры не входят.
servers:
  - url: http://moysklad-stub:8080
    description: Процесс заглушки в учебном стенде
tags:
  - name: Control
    description: Управление состоянием и отказами, не часть Remap API
paths: {}
components:
  schemas: {}
