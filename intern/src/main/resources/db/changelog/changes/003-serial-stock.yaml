- changeSet:
    id: 003-serial-stock-stock
    author: mosinprss
    changes:
    - createTable:
        tableName: stock
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: stockPK
        - column:
            name: serial_number_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: lot_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: place_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: document_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: moment
            type: TIMESTAMP
            constraints:
              nullable: false
        - column:
            name: momentfrom
            type: TIMESTAMP
            constraints:
              nullable: false
        - column:
            name: momentto
            type: TIMESTAMP
        - column:
            name: stock
            type: INTEGER
            constraints:
              nullable: false
        - column:
            name: delta
            type: INTEGER
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: stock
        baseColumnNames: serial_number_id
        referencedTableName: serial_number
        referencedColumnNames: id
        constraintName: fk_stock_serial_number
        validate: true
    - addForeignKeyConstraint:
        baseTableName: stock
        baseColumnNames: lot_id
        referencedTableName: lot
        referencedColumnNames: id
        constraintName: fk_stock_lot
        validate: true
    - addForeignKeyConstraint:
        baseTableName: stock
        baseColumnNames: place_id
        referencedTableName: warehouse
        referencedColumnNames: id
        constraintName: fk_stock_place
        validate: true
    - addForeignKeyConstraint:
        baseTableName: stock
        baseColumnNames: document_id
        referencedTableName: documents
        referencedColumnNames: id
        constraintName: fk_stock_documents
        validate: true
    - createIndex:
        tableName: stock
        indexName: idx_stock_serial_number_lot_place
        columns:
        - column:
            name: serial_number_id
        - column:
            name: lot_id
        - column:
            name: place_id
        - column:
            name: momentfrom
