            type: UUID
            constraints:
              nullable: false
    - addPrimaryKey:
        tableName: positions_serial_number
        columnNames: positions_id, serial_number_id
        constraintName: positionsSerialNumberPK
    - addForeignKeyConstraint:
        baseTableName: positions_serial_number
        baseColumnNames: positions_id
        referencedTableName: positions
        referencedColumnNames: id
        constraintName: fk_positions_serial_number_positions
