databaseChangeLog:
- changeSet:
    id: 003-serial-stock-warehouse
    author: mosinprss
    changes:
    - createTable:
        tableName: warehouse
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: warehousePK
        - column:
            name: name
            type: VARCHAR(255)
            constraints:
              nullable: false
- changeSet:
    id: 003-serial-stock-lot
    author: mosinprss
    changes:
    - createTable:
        tableName: lot
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: lotPK
        - column:
            name: name
            type: VARCHAR(255)
            constraints:
              nullable: false
- changeSet:
    id: 003-serial-stock-serial-number
    author: mosinprss
    changes:
    - createTable:
        tableName: serial_number
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: serialNumberPK
        - column:
            name: name
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: lot_id
            type: UUID
            constraints:
              nullable: false
    - addUniqueConstraint:
        tableName: serial_number
        columnNames: lot_id, name
        constraintName: uq_serial_number_lot_name
    - addForeignKeyConstraint:
        baseTableName: serial_number
        baseColumnNames: lot_id
        referencedTableName: lot
        referencedColumnNames: id
        constraintName: fk_serial_number_lot
        validate: true
- changeSet:
    id: 003-serial-stock-documents
    author: mosinprss
    changes:
    - createTable:
        tableName: documents
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: documentsPK
        - column:
            name: dtype
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: name
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: moment
            type: TIMESTAMP
            constraints:
              nullable: false
        - column:
            name: created
            type: TIMESTAMP
            constraints:
              nullable: false
        - column:
            name: applicable
            type: BOOLEAN
            constraints:
              nullable: false
        - column:
            name: source_store_id
            type: UUID
        - column:
            name: target_store_id
            type: UUID
    - addForeignKeyConstraint:
        baseTableName: documents
        baseColumnNames: source_store_id
        referencedTableName: warehouse
        referencedColumnNames: id
        constraintName: fk_documents_source_store
        validate: true
    - addForeignKeyConstraint:
        baseTableName: documents
        baseColumnNames: target_store_id
        referencedTableName: warehouse
        referencedColumnNames: id
        constraintName: fk_documents_target_store
        validate: true
