databaseChangeLog:
- changeSet:
    id: 004-aggregate-stock
    author: mosinprss
    changes:
    - createTable:
        tableName: aggregate_stock
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: aggregateStockPK
        - column:
            name: product_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: store_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: consignment_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: quantity
            type: NUMERIC(19, 6)
            constraints:
              nullable: false
        - column:
            name: version
            type: BIGINT
            constraints:
              nullable: false
    - addUniqueConstraint:
        tableName: aggregate_stock
        columnNames: product_id, store_id, consignment_id
        constraintName: uq_aggregate_stock_product_store_consignment
    - addForeignKeyConstraint:
        baseTableName: aggregate_stock
        baseColumnNames: product_id
        referencedTableName: products
        referencedColumnNames: id
        constraintName: fk_aggregate_stock_product
        validate: true
    - addForeignKeyConstraint:
        baseTableName: aggregate_stock
        baseColumnNames: store_id
        referencedTableName: warehouse
        referencedColumnNames: id
        constraintName: fk_aggregate_stock_store
        validate: true
    - addForeignKeyConstraint:
        baseTableName: aggregate_stock
        baseColumnNames: consignment_id
        referencedTableName: lot
        referencedColumnNames: id
        constraintName: fk_aggregate_stock_consignment
        validate: true
    - sql:
        sql: ALTER TABLE aggregate_stock ADD CONSTRAINT chk_aggregate_stock_quantity_non_negative CHECK (quantity >= 0)

- changeSet:
    id: 004-price
    author: mosinprss
    changes:
    - createTable:
        tableName: price
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: pricePK
        - column:
            name: stock_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: product_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: article
            type: VARCHAR(255)
        - column:
            name: unit_price
            type: NUMERIC(19, 6)
            constraints:
              nullable: false
        - column:
            name: total_cost
            type: NUMERIC(19, 6)
            constraints:
              nullable: false
    - addUniqueConstraint:
        tableName: price
        columnNames: stock_id
        constraintName: uq_price_stock_id
    - addForeignKeyConstraint:
        baseTableName: price
        baseColumnNames: stock_id
        referencedTableName: aggregate_stock
        referencedColumnNames: id
        constraintName: fk_price_aggregate_stock
        validate: true
    - addForeignKeyConstraint:
        baseTableName: price
        baseColumnNames: product_id
        referencedTableName: products
        referencedColumnNames: id
        constraintName: fk_price_product
        validate: true
    - sql:
        sql: ALTER TABLE price ADD CONSTRAINT chk_price_unit_price_non_negative CHECK (unit_price >= 0)
    - sql:
        sql: ALTER TABLE price ADD CONSTRAINT chk_price_total_cost_non_negative CHECK (total_cost >= 0)

- changeSet:
    id: 004-stock-movement
    author: mosinprss
    changes:
    - createTable:
        tableName: stock_movement
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: stockMovementPK
        - column:
            name: document_id
            type: UUID
        - column:
            name: document_position_id
            type: UUID
        - column:
            name: product_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: store_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: consignment_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: quantity_delta
            type: NUMERIC(19, 6)
            constraints:
              nullable: false
        - column:
            name: moment
            type: TIMESTAMP WITHOUT TIME ZONE
            constraints:
              nullable: false
        - column:
            name: operation_type
            type: VARCHAR(64)
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: stock_movement
        baseColumnNames: product_id
        referencedTableName: products
        referencedColumnNames: id
        constraintName: fk_stock_movement_product
        validate: true
    - addForeignKeyConstraint:
        baseTableName: stock_movement
        baseColumnNames: store_id
        referencedTableName: warehouse
        referencedColumnNames: id
        constraintName: fk_stock_movement_store
        validate: true
    - addForeignKeyConstraint:
        baseTableName: stock_movement
        baseColumnNames: consignment_id
        referencedTableName: lot
        referencedColumnNames: id
        constraintName: fk_stock_movement_consignment
        validate: true
    - createIndex:
        tableName: stock_movement
        indexName: idx_stock_movement_product_store_consignment_moment
        columns:
        - column:
            name: product_id
        - column:
            name: store_id
        - column:
            name: consignment_id
        - column:
            name: moment

- changeSet:
