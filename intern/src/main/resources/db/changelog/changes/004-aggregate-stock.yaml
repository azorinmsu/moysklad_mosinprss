        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
              primaryKeyName: processingRequestPK
        - column:
            name: request_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: command_type
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: status
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: correlation_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: payload
            type: TEXT
            constraints:
              nullable: false
        - column:
            name: created_at
            type: TIMESTAMP WITHOUT TIME ZONE
            constraints:
              nullable: false
        - column:
            name: updated_at
            type: TIMESTAMP WITHOUT TIME ZONE
            constraints:
              nullable: false
        - column:
            name: version
