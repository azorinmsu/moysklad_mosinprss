spring.application.name=intern
# env usage as key-val
spring.config.import=optional:file:.env[.properties]


spring.datasource.url=jdbc:postgresql://localhost:5432/intern
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

credentials.login=admin
credentials.password=1234

api.credentials.login=${MOYSKLAD_LOGIN}
api.credentials.password=${MOYSKLAD_PASSWORD}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=intern-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.moysklad.intern.dto.kafka
spring.kafka.producer.properties.spring.json.add.type.headers=true

app.kafka.topics.stock-commands=stock.commands
app.kafka.topics.sales-commands=sales.commands
app.kafka.topics.processing-results=processing.results
app.kafka.topics.processing-results-dlq=processing.results.dlq

# Camunda (embedded engine, schema ACT_* рядом с прикладными таблицами)
app.camunda.job-executor-activate=true
app.camunda.sales-timer-cycle=R/PT30S