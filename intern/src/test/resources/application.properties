spring.application.name=intern

spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

credentials.login=test
credentials.password=test

api.credentials.login=test
api.credentials.password=test

spring.kafka.consumer.group-id=intern-processor-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.moysklad.intern.dto.kafka
spring.kafka.producer.properties.spring.json.add.type.headers=true

app.kafka.topics.stock-commands=stock.commands
app.kafka.topics.sales-commands=sales.commands
app.kafka.topics.processing-results=processing.results
app.kafka.topics.processing-results-dlq=processing.results.dlq

app.camunda.job-executor-activate=false
app.camunda.sales-timer-cycle=R/PT1H
